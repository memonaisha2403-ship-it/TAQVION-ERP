<style>
/* ===== Base reset & foundations ===== */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
button { font-family: inherit; cursor: pointer; background: none; border: none; padding: 0; color: inherit; }
input, textarea, select { font-family: inherit; font-size: inherit; }
a { color: inherit; text-decoration: none; }
svg { display: block; }
#root { min-height: 100vh; }

/* ===== Animations ===== */
@keyframes taqSlideIn { from { transform: translateX(24px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
@keyframes taqFadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
@keyframes spin { to { transform: rotate(360deg); } }
.taq-anim-in { animation: taqFadeUp 0.35s ease-out; }
.animate-spin { animation: spin 1s linear infinite; }

/* ===== Scrollbars ===== */
.taq-scroll::-webkit-scrollbar { width: 7px; height: 7px; }
.taq-scroll::-webkit-scrollbar-track { background: transparent; }
.taq-scroll::-webkit-scrollbar-thumb { background: #33415560; border-radius: 9999px; }

/* ===== Numeric alignment ===== */
.taq-num { font-variant-numeric: tabular-nums; }

/* ===== Print ===== */
@media print {
  .taq-no-print { display: none !important; }
  .taq-print-area { position: static !important; box-shadow: none !important; }
  body { background: #ffffff !important; }
}

function chartAxisColors(theme) {
  return {
    text: theme === "dark" ? "#94A3B8" : "#64748B",
    grid: theme === "dark" ? "#1E293B" : "#F1F5F9",
    legend: theme === "dark" ? "#CBD5E1" : "#475569",
  };
}
function ChartCanvas({ type, data, options, height = 250 }) {
  const canvasRef = useRef(null);
  const chartRef = useRef(null);
  const dataKey = JSON.stringify(data);
  const optKey = JSON.stringify(options);
  useEffect(() => {
    if (!canvasRef.current || typeof Chart === "undefined") return;
    if (chartRef.current) chartRef.current.destroy();
    chartRef.current = new Chart(canvasRef.current, { type, data, options });
    return () => { if (chartRef.current) { chartRef.current.destroy(); chartRef.current = null; } };
  }, [type, dataKey, optKey]);
  return (
    <div style={{ height, position: "relative" }}>
      {typeof Chart === "undefined" ? (
        <div style={{ display: "flex", alignItems: "center", justifyContent: "center", height: "100%", fontSize: 12, color: "#94A3B8", textAlign: "center", padding: 16 }}>
          Chart.js didn't load from the CDN — data is still available in the tables and exports elsewhere on this page.
        </div>
      ) : (
        <canvas ref={canvasRef}></canvas>
      )}
    </div>
  );
}

function mulberry32(seed) {
  return function () {
    seed |= 0;
    seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rng = mulberry32(20260928);

function pad2(n) { return String(n).padStart(2, "0"); }
function randTime(baseHour, spreadMinutes) {
  return `${pad2(baseHour)}:${pad2(Math.floor(rng() * spreadMinutes))}`;
}
function addDays(date, n) {
  const d = new Date(date);
  d.setDate(d.getDate() + n);
  return d;
}
function isoDate(d) { return d.toISOString().slice(0, 10); }
function fmtDate(d) {
  const dt = typeof d === "string" ? new Date(d) : d;
  return dt.toLocaleDateString("en-IN", { day: "2-digit", month: "short", year: "numeric" });
}
function fmtDateShort(d) {
  const dt = typeof d === "string" ? new Date(d) : d;
  return dt.toLocaleDateString("en-IN", { day: "2-digit", month: "short" });
}
function fmtINR(n) {
  const v = Math.round(n || 0);
  return "₹" + v.toLocaleString("en-IN");
}
function fmtINRShort(n) {
  const v = Math.abs(n || 0);
  const sign = n < 0 ? "-" : "";
  if (v >= 1e7) return sign + "₹" + (v / 1e7).toFixed(2).replace(/\.00$/, "") + " Cr";
  if (v >= 1e5) return sign + "₹" + (v / 1e5).toFixed(2).replace(/\.00$/, "") + " L";
  if (v >= 1e3) return sign + "₹" + (v / 1e3).toFixed(1).replace(/\.0$/, "") + "K";
  return sign + "₹" + v;
}
function initials(name) {

}
function daysBetween(a, b) { return Math.round((b - a) / 86400000); }
function clamp(n, min, max) { return Math.max(min, Math.min(max, n)); }
function downloadFile(filename, content, mime) {
  const blob = new Blob([content], { type: mime || "text/plain" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function toCSV(rows) {
  if (!rows || !rows.length) return "";
  const headers = Object.keys(rows[0]);
  const esc = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
  return [headers.join(","), ...rows.map((r) => headers.map((h) => esc(r[h])).join(","))].join("\n");
}

function calcLineTotals(items) { return items.reduce((s, it) => s + it.qty * it.price, 0); }
function calcQuotationTotals(q) {
  const subtotal = calcLineTotals(q.items);
  const discount = (subtotal * (q.discountPct || 0)) / 100;
  const taxable = subtotal - discount;
  const tax = (taxable * (q.taxPct || 0)) / 100;
  return { subtotal, discount, tax, total: taxable + tax };
}
function calcInvoiceTotals(inv) {
  const subtotal = calcLineTotals(inv.items);
  const tax = (subtotal * (inv.taxPct || 0)) / 100;
  const total = subtotal + tax;
  const paid = inv.amountPaid || 0;
  return { subtotal, tax, total, balance: Math.max(0, total - paid) };
}

function computePayroll(emp, seed) {
  const perDay = emp.salary / WORKING_DAYS_MONTH;
  const earnedBasic = perDay * seed.presentDays;
  const overtimePay = (perDay / 8) * seed.overtimeHrs * 1.5;
  const gross = earnedBasic + overtimePay + seed.bonus;
  const tax = Math.round(gross * 0.1);
  const net = Math.round(gross - seed.deduction - tax);
  return { ...seed, basic: emp.salary, earnedBasic: Math.round(earnedBasic), overtimePay: Math.round(overtimePay), gross: Math.round(gross), tax, net };
}

function genAttendance() {
  const records = {};
  const start = new Date(2026, 8, 1);
  for (const emp of EMPLOYEES) {
    const days = [];
    for (let d = new Date(start); d <= DEMO_TODAY; d = addDays(d, 1)) {
      const dow = d.getDay();
      if (dow === 0 || dow === 6) continue;
      const r = rng();
      let status = "Present";
      if (r < 0.04) status = "Absent";
      else if (r < 0.09) status = "Half Day";
      else if (r < 0.18) status = "Work From Home";
      const late = status === "Present" && rng() < 0.15;
      days.push({
        date: isoDate(d),
        status,
        late,
        checkIn: status === "Absent" ? null : late ? randTime(10, 45) : randTime(9, 30),
        checkOut: status === "Absent" ? null : status === "Half Day" ? randTime(14, 30) : randTime(18, 45),
      });
    }
    records[emp.id] = days;
  }
  return records;
}
const ATTENDANCE = genAttendance();
function attendanceStats(empId) {
  const days = ATTENDANCE[empId] || [];
  const total = days.length;
  const present = days.filter((d) => d.status === "Present").length;
  const wfh = days.filter((d) => d.status === "Work From Home").length;
  const half = days.filter((d) => d.status === "Half Day").length;
  const absent = days.filter((d) => d.status === "Absent").length;
  const late = days.filter((d) => d.late).length;
  const pct = total ? Math.round(((present + wfh + half * 0.5) / total) * 100) : 0;
  return { total, present, wfh, half, absent, late, pct };
}

function computeMonthlySummary({ employees, tasks, projects, invoices }) {
  const insights = [];
  const overdueTasks = tasks.filter((t) => t.status !== "COMPLETED" && new Date(t.deadline) < DEMO_TODAY);
  if (overdueTasks.length) insights.push({ type: "warning", text: `${overdueTasks.length} task${overdueTasks.length > 1 ? "s are" : " is"} overdue and need${overdueTasks.length > 1 ? "" : "s"} immediate attention.` });
  const atRisk = projects.filter((p) => p.status !== "Completed" && p.status !== "Cancelled" && new Date(p.deadline) < addDays(DEMO_TODAY, 21) && p.progress < 90);
  if (atRisk.length) insights.push({ type: "warning", text: `${atRisk.length} project${atRisk.length > 1 ? "s are" : " is"} at risk of missing ${atRisk.length > 1 ? "their" : "its"} deadline: ${atRisk.map((p) => p.name.split(" — ")[0]).join(", ")}.` });
  const overBudget = projects.filter((p) => p.spent > p.budget);
  if (overBudget.length) insights.push({ type: "warning", text: `${overBudget.length} project${overBudget.length > 1 ? "s are" : " is"} over budget.` });
  const overdueInvoices = invoices.filter((i) => i.status === "Overdue");
  const overdueTotal = overdueInvoices.reduce((s, i) => s + calcInvoiceTotals(i).total, 0);
  if (overdueInvoices.length) insights.push({ type: "warning", text: `${fmtINR(overdueTotal)} across ${overdueInvoices.length} invoice${overdueInvoices.length > 1 ? "s" : ""} is overdue.` });
  const top = [...employees].sort((a, b) => b.productivity - a.productivity)[0];
  if (top) insights.push({ type: "positive", text: `${top.name} leads the team in productivity this month at ${top.productivity}%.` });
  const avgProd = Math.round(employees.reduce((s, e) => s + e.productivity, 0) / employees.length);
  insights.push({ type: "info", text: `Average team productivity is ${avgProd}% across ${employees.length} employees.` });
  const completed = tasks.filter((t) => t.status === "COMPLETED").length;
  insights.push({ type: "info", text: `${completed} of ${tasks.length} tasks are complete (${Math.round((completed / tasks.length) * 100)}%).` });
  return insights;
}

function useNotifications() {
  const { tasks, invoices, leaves, projects, employees, session } = useApp();
  return useMemo(() => {
    const items = [];
    tasks.filter((t) => t.status !== "COMPLETED" && new Date(t.deadline) < DEMO_TODAY).slice(0, 5).forEach((t) => {
      items.push({ icon: AlertTriangle, color: CHART_COLORS.rose, text: `Task overdue: ${t.title}`, time: t.deadline });
    });
    invoices.filter((i) => i.status === "Overdue" || (i.status === "Sent" && daysBetween(DEMO_TODAY, new Date(i.dueDate)) <= 5 && daysBetween(DEMO_TODAY, new Date(i.dueDate)) >= 0)).forEach((i) => {
      items.push({ icon: Receipt, color: CHART_COLORS.amber, text: `Invoice ${i.id} ${i.status === "Overdue" ? "is overdue" : "due soon"} — ${getClient(i.clientId)?.company || ""}`, time: i.dueDate });
    });
    if (["Super Admin", "Admin/HR"].includes(session.role)) {
      leaves.filter((l) => l.status === "Pending").forEach((l) => {
        items.push({ icon: CalendarDays, color: CHART_COLORS.blue, text: `Leave request from ${getEmployee(l.employeeId)?.name}`, time: l.appliedOn });
      });
    }
    projects.filter((p) => p.status !== "Completed" && p.status !== "Cancelled" && daysBetween(DEMO_TODAY, new Date(p.deadline)) >= 0 && daysBetween(DEMO_TODAY, new Date(p.deadline)) <= 7).forEach((p) => {
      items.push({ icon: Briefcase, color: CHART_COLORS.violet, text: `${p.name.split(" — ")[0]} is due this week`, time: p.deadline });
    });
    return items.sort((a, b) => new Date(a.time) - new Date(b.time));
  }, [tasks, invoices, leaves, projects, session.role]);
}

function seededVariance(id, range) {
  let h = 0;
  for (let i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) % 97;
  return (h / 97) * range - range / 2;
}

const PERFORMANCE_RATINGS = {
  E01: { quality: 4.8, managerRating: 4.9, selfRating: 4.7 },
  E02: { quality: 4.4, managerRating: 4.5, selfRating: 4.3 },
  E03: { quality: 4.6, managerRating: 4.7, selfRating: 4.5 },
  E04: { quality: 4.7, managerRating: 4.8, selfRating: 4.6 },
  E05: { quality: 4.5, managerRating: 4.6, selfRating: 4.4 },
  E06: { quality: 4.3, managerRating: 4.4, selfRating: 4.2 },
  E07: { quality: 4.1, managerRating: 4.3, selfRating: 4.2 },
  E08: { quality: 4.2, managerRating: 4.3, selfRating: 4.1 },
  E09: { quality: 3.8, managerRating: 3.9, selfRating: 3.9 },
  E10: { quality: 4.0, managerRating: 4.1, selfRating: 4.0 },
};
const MONTHLY_PERFORMANCE_OVERRIDE = {
  E05: { tasksAssigned: 42, tasksCompleted: 37, deadlineAchievement: 92, workingHours: 176, productiveHours: 151, qualityScore: 4.5, managerRating: 4.6, selfRating: 4.4, overallScore: 91, avgCompletionDays: 3.2 },
};

function computeMonthlyPerformance(emp, tasks) {
  const myTasks = tasks.filter((t) => t.assigneeId === emp.id);
  const projectsContributed = new Set(myTasks.map((t) => t.projectId).filter(Boolean)).size;
  if (MONTHLY_PERFORMANCE_OVERRIDE[emp.id]) {
    const o = MONTHLY_PERFORMANCE_OVERRIDE[emp.id];
    return { ...o, tasksPending: Math.max(0, o.tasksAssigned - o.tasksCompleted - 2), tasksOverdue: 2, completionPct: Math.round((o.tasksCompleted / o.tasksAssigned) * 100), projectsContributed: projectsContributed || 2 };
  }
  const tasksAssigned = myTasks.length || 1;
  const tasksCompleted = myTasks.filter((t) => t.status === "COMPLETED").length;
  const tasksOverdue = myTasks.filter((t) => t.status !== "COMPLETED" && new Date(t.deadline) < DEMO_TODAY).length;
  const tasksPending = myTasks.filter((t) => t.status !== "COMPLETED").length;
  const att = attendanceStats(emp.id);
  const workingHours = Math.round((att.present + att.wfh) * 8 + att.half * 4);
  const productiveHours = Math.round(myTasks.reduce((s, t) => s + (t.actHours || 0), 0));
  const deadlineAchievement = clamp(Math.round(emp.productivity + seededVariance(emp.id, 6)), 55, 100);
  const ratings = PERFORMANCE_RATINGS[emp.id] || { quality: 4.0, managerRating: 4.0, selfRating: 4.0 };
  return {
    tasksAssigned, tasksCompleted, tasksPending, tasksOverdue,
    completionPct: Math.round((tasksCompleted / tasksAssigned) * 100),
    workingHours, productiveHours, projectsContributed,
    avgCompletionDays: Math.round((3 + seededVariance(emp.id, 3)) * 10) / 10,
    deadlineAchievement, qualityScore: ratings.quality, managerRating: ratings.managerRating, selfRating: ratings.selfRating,
    overallScore: emp.performanceScore,
  };
}

const ATTENDANCE_DATES = (ATTENDANCE[EMPLOYEES[0].id] || []).map((d) => d.date);
function dailyCompanyAttendance() {
  return ATTENDANCE_DATES.map((date) => {
    let presentEquiv = 0;
    EMPLOYEES.forEach((e) => {
      const rec = (ATTENDANCE[e.id] || []).find((d) => d.date === date);
      if (rec) { if (rec.status === "Present" || rec.status === "Work From Home") presentEquiv += 1; else if (rec.status === "Half Day") presentEquiv += 0.5; }
    });
    return { date, pct: Math.round((presentEquiv / EMPLOYEES.length) * 100) };
  });
}

function MyLeave() {
  const { theme, session, leaves, setLeaves, logAudit } = useApp();
  const me = getEmployee(session.employeeId);
  const [showApply, setShowApply] = useState(false);
  const myLeaves = leaves.filter((l) => l.employeeId === me.id).slice().sort((a, b) => new Date(b.appliedOn) - new Date(a.appliedOn));
  const usedByType = {};
  LEAVE_TYPES.forEach((t) => { usedByType[t] = myLeaves.filter((l) => l.type === t && l.status === "Approved").reduce((s, l) => s + l.days, 0); });

  function apply(data) {
    const days = daysBetween(new Date(data.from), new Date(data.to)) + 1;
    const newLeave = { id: "L" + (leaves.length + 1), employeeId: me.id, status: "Pending", appliedOn: isoDate(DEMO_TODAY), days, ...data };
    setLeaves((prev) => [newLeave, ...prev]);
    logAudit(`${me.name} applied for ${data.type}`);
    setShowApply(false);
  }

  return (
    <div className="taq-anim-in">
      <PageHeader title="Leave" subtitle="Your balance and requests" action={<Button onClick={() => setShowApply(true)}><Plus size={15} /> Apply for leave</Button>} />

      <Card className="p-5">
        <SectionHeader title="My requests" />

          <div className="space-y-2">

function ManageLeave() {
  const { theme, leaves, setLeaves, logAudit } = useApp();
  const [filter, setFilter] = useState("Pending");
  const filtered = filter === "All" ? leaves : leaves.filter((l) => l.status === filter);
  const sorted = filtered.slice().sort((a, b) => new Date(b.appliedOn) - new Date(a.appliedOn));
  const pendingCount = leaves.filter((l) => l.status === "Pending").length;

  function updateStatus(id, status) {
    const l = leaves.find((x) => x.id === id);
    setLeaves((prev) => prev.map((x) => (x.id === id ? { ...x, status } : x)));

    <div className="taq-anim-in">
      <PageHeader title="Leave" subtitle={`${pendingCount} request${pendingCount !== 1 ? "s" : ""} awaiting approval`} />

          <div className="space-y-2">
            {sorted.map((l) => {

function TaskDetailModal({ task, onClose }) {
  const { theme, session, tasks, setTasks, logAudit } = useApp();
  const [comment, setComment] = useState("");
  const [comments, setComments] = useState([]);
  useEffect(() => { setComments(task?.comments || []); }, [task?.id]);
  if (!task) return null;
  const assignee = getEmployee(task.assigneeId);
  const project = task.projectId ? getProject(task.projectId) : null;
  const canManage = ["Super Admin", "Admin/HR", "Project Manager", "Team Leader"].includes(session.role) || session.employeeId === task.assigneeId;
  const overdue = new Date(task.deadline) < DEMO_TODAY && task.status !== "COMPLETED";

  function changeStatus(status) {
    setTasks((prev) => prev.map((t) => (t.id === task.id ? { ...t, status, progress: status === "COMPLETED" ? 100 : t.progress } : t)));
    logAudit(`Moved "${task.title}" to ${status}`);
  }
  function addComment() {
    if (!comment.trim()) return;
    const c = { author: getEmployee(session.employeeId)?.name || session.role, text: comment, time: isoDate(DEMO_TODAY) };
    setComments((prev) => [...prev, c]);
    setTasks((prev) => prev.map((t) => (t.id === task.id ? { ...t, comments: [...(t.comments || []), c] } : t)));
    setComment("");
  }

  return (
    <Modal open={!!task} onClose={onClose} title={task.title} wide>
      <div className="space-y-5">
        <div className="flex flex-wrap items-center gap-2">
          <Badge status={task.priority}>{task.priority} priority</Badge>
          <Badge status={task.status} />
          {overdue && <span className="text-xs font-medium text-rose-500 flex items-center gap-1"><AlertTriangle size={12} /> Overdue</span>}

function TasksView() {
  const { theme, tasks, setTasks, projects, session, logAudit } = useApp();
  const [mode, setMode] = useState("kanban");
  const [search, setSearch] = useState("");
  const [projectFilter, setProjectFilter] = useState("All");
  const [priorityFilter, setPriorityFilter] = useState("All");
  const [selected, setSelected] = useState(null);
  const [showAdd, setShowAdd] = useState(false);

  const isEmployee = session.role === "Employee";
  const base = isEmployee ? tasks.filter((t) => t.assigneeId === session.employeeId) : tasks;
  const filtered = base.filter((t) => t.title.toLowerCase().includes(search.toLowerCase()) && (projectFilter === "All" || t.projectId === projectFilter) && (priorityFilter === "All" || t.priority === priorityFilter));

  function moveTask(id, status) {
    const t = tasks.find((x) => x.id === id);
    setTasks((prev) => prev.map((x) => (x.id === id ? { ...x, status, progress: status === "COMPLETED" ? 100 : x.progress } : x)));
    if (t) logAudit(`Moved "${t.title}" to ${status}`);
  }
  function addTask(data) {
    const id = "T" + (tasks.length + 1 + Math.floor(Math.random() * 1000));
    setTasks((prev) => [...prev, { id, status: "TODO", progress: 0, actHours: 0, startDate: isoDate(DEMO_TODAY), ...data }]);
    logAudit(`Created task "${data.title}"`);
    setShowAdd(false);
  }
  const projectOptions = [{ value: "All", label: "All projects" }, ...projects.map((p) => ({ value: p.id, label: p.name.split(" — ")[0] }))];

  return (
    <div className="taq-anim-in">
      <PageHeader title="Tasks" subtitle={`${filtered.length} of ${base.length} tasks`} action={<Button onClick={() => setShowAdd(true)}><Plus size={15} /> New task</Button>} />
      <div className="flex flex-wrap items-center justify-between gap-3 mb-5">
        <div className="flex flex-wrap items-center gap-2">
          <SearchBox value={search} onChange={setSearch} placeholder="Search tasks…" />
          <Select value={projectFilter} onChange={setProjectFilter} options={projectOptions} />
          <Select value={priorityFilter} onChange={setPriorityFilter} options={["All", "Low", "Medium", "High", "Urgent"]} />
        </div>
        <ViewToggle mode={mode} setMode={setMode} />
      </div>

      {mode === "kanban" ? (
        <KanbanBoard
          columns={TASK_STATUSES.map((s) => ({ key: s, label: s }))}
          items={filtered}
          statusKey="status"
          onMove={moveTask}
          renderCard={(t) => (
            <Card className="p-3 hover:-translate-y-0.5 transition-transform cursor-pointer" onClick={() => setSelected(t)}>
              <div className={`text-sm font-medium leading-snug mb-2 ${tw(theme, "text-white", "text-slate-900")}`}>{t.title}</div>
              <div className="flex items-center justify-between">
                <Badge status={t.priority}>{t.priority}</Badge>
                <Avatar name={getEmployee(t.assigneeId)?.name || "?"} size={22} />
              </div>
              <div className={`text-xs mt-2 ${new Date(t.deadline) < DEMO_TODAY && t.status !== "COMPLETED" ? "text-rose-500 font-medium" : tw(theme, "text-slate-500", "text-slate-400")}`}>Due {fmtDateShort(t.deadline)}</div>
            </Card>
          )}
        />
      ) : (
        <Card className="p-5">
          <div className="overflow-x-auto taq-scroll">
            <table className="w-full text-sm">
              <thead><tr className={`text-left text-xs ${tw(theme, "text-slate-500", "text-slate-400")}`}><th className="pb-2 font-medium">Task</th><th className="pb-2 font-medium">Project</th><th className="pb-2 font-medium">Assignee</th><th className="pb-2 font-medium">Priority</th><th className="pb-2 font-medium">Status</th><th className="pb-2 font-medium">Deadline</th></tr></thead>
              <tbody>
                {filtered.map((t) => (
                  <tr key={t.id} onClick={() => setSelected(t)} className={`border-t cursor-pointer ${tw(theme, "border-slate-800 hover:bg-slate-800/40", "border-slate-100 hover:bg-slate-50")}`}>
                    <td className={`py-2.5 ${tw(theme, "text-white", "text-slate-900")}`}>{t.title}</td>
                    <td className={`py-2.5 ${tw(theme, "text-slate-400", "text-slate-500")}`}>{t.projectId ? getProject(t.projectId)?.name.split(" — ")[0] : "Internal"}</td>
                    <td className={`py-2.5 ${tw(theme, "text-slate-400", "text-slate-500")}`}>{getEmployee(t.assigneeId)?.name}</td>
                    <td className="py-2.5"><Badge status={t.priority}>{t.priority}</Badge></td>
                    <td className="py-2.5"><Badge status={t.status} /></td>
                    <td className={`py-2.5 ${new Date(t.deadline) < DEMO_TODAY && t.status !== "COMPLETED" ? "text-rose-500 font-medium" : tw(theme, "text-slate-400", "text-slate-500")}`}>{fmtDateShort(t.deadline)}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          {filtered.length === 0 && <EmptyState icon={CheckSquare} title="No tasks match" />}
        </Card>
      )}

      <TaskDetailModal task={selected} onClose={() => setSelected(null)} />
      <Modal open={showAdd} onClose={() => setShowAdd(false)} title="New task">
        <AddTaskForm onSubmit={addTask} onCancel={() => setShowAdd(false)} />
      </Modal>
    </div>
  );
}

            <div className={`text-sm font-medium mb-1 ${tw(theme, "text-white", "text-slate-900")}`}>{l.company}</div>
            <div className={`text-xs mb-2.5 ${tw(theme, "text-slate-500", "text-slate-400")}`}>{l.contact}</div>

function QuotationPreview({ q, onClose }) {
  const { theme, quotations, setQuotations, projects, setProjects, leads, setView, logAudit } = useApp();
  if (!q) return null;
  const client = q.clientId ? getClient(q.clientId) : null;
  const lead = q.leadId ? leads.find((l) => l.id === q.leadId) : null;
  const totals = calcQuotationTotals(q);

  function setStatus(status) {
    setQuotations((prev) => prev.map((x) => (x.id === q.id ? { ...x, status } : x)));
    logAudit(`Quotation ${q.id} marked ${status}`);
  }
  function convertToProject() {
    const newId = "P" + String(projects.length + 1).padStart(2, "0") + "X";
    const newProject = { id: newId, name: q.title, clientId: q.clientId || null, pmId: "E03", teamIds: ["E05"], startDate: isoDate(DEMO_TODAY), deadline: isoDate(addDays(DEMO_TODAY, 90)), budget: totals.total, spent: 0, status: "Planning", progress: 0, tech: ["TBD"], description: `Created automatically from quotation ${q.id}.` };
    setProjects((prev) => [...prev, newProject]);
    setQuotations((prev) => prev.map((x) => (x.id === q.id ? { ...x, linkedProjectId: newId } : x)));
    logAudit(`Converted quotation ${q.id} into project "${q.title}"`);
    onClose();
    setView("projects");
  }

  return (
    <Modal open={!!q} onClose={onClose} title="Quotation" wide>
      <div className="taq-print-area">
        <DocumentLetterhead theme={theme} docId={q.id} dateLine={`Dated ${fmtDate(q.date)}`} />
        <div className="flex items-center justify-between mb-5">
          <div>
            <div className={`text-xs ${tw(theme, "text-slate-500", "text-slate-400")}`}>Prepared for</div>
            <div className={`text-base font-semibold ${tw(theme, "text-white", "text-slate-900")}`}>{client?.company || lead?.company}</div>
            <div className={`text-sm ${tw(theme, "text-slate-400", "text-slate-500")}`}>{q.title}</div>
          </div>
          <Badge status={q.status} />
        </div>
        <DocumentLineItems items={q.items} theme={theme} />
        <div className="flex justify-end mb-6">
          <div style={{ width: 240 }} className="space-y-1.5 text-sm">
            <div className="flex justify-between"><span className={tw(theme, "text-slate-400", "text-slate-500")}>Subtotal</span><span className={`taq-num ${tw(theme, "text-slate-200", "text-slate-700")}`}>{fmtINR(totals.subtotal)}</span></div>
            {q.discountPct > 0 && <div className="flex justify-between"><span className={tw(theme, "text-slate-400", "text-slate-500")}>Discount ({q.discountPct}%)</span><span className="taq-num text-rose-500">-{fmtINR(totals.discount)}</span></div>}
            <div className="flex justify-between"><span className={tw(theme, "text-slate-400", "text-slate-500")}>GST ({q.taxPct}%)</span><span className={`taq-num ${tw(theme, "text-slate-200", "text-slate-700")}`}>{fmtINR(totals.tax)}</span></div>
            <div className={`flex justify-between pt-2 border-t font-semibold text-base ${tw(theme, "border-slate-800 text-white", "border-slate-200 text-slate-900")}`}><span>Total</span><span className="taq-num">{fmtINR(totals.total)}</span></div>
          </div>
        </div>
        {q.notes && <p className={`text-xs mb-3 ${tw(theme, "text-slate-500", "text-slate-400")}`}>Note: {q.notes}</p>}
        <p className={`text-xs ${tw(theme, "text-slate-500", "text-slate-400")}`}>Valid until {fmtDate(q.validity)}. Generated by the TAQVION ERP demo for illustration only.</p>
      </div>
      <div className="flex flex-wrap items-center justify-between gap-3 mt-6 pt-5 border-t taq-no-print" style={{ borderColor: tw(theme, "#1E293B", "#E2E8F0") }}>
        <div className="flex flex-wrap gap-1.5">
          {QUOTATION_STATUSES.map((s) => (
            <button key={s} onClick={() => setStatus(s)} disabled={s === q.status} className="text-xs px-2.5 py-1.5 rounded-lg font-medium disabled:opacity-40" style={s === q.status ? { background: BRAND.cyan, color: BRAND.navy } : { background: tw(theme, "#1E293B", "#F1F5F9"), color: tw(theme, "#CBD5E1", "#475569") }}>{s}</button>
          ))}
        </div>
        <div className="flex gap-2">
          <Button variant="secondary" size="sm" onClick={() => window.print()}><Printer size={14} /> Print / Save PDF</Button>
          {q.status === "Approved" && !q.linkedProjectId && <Button size="sm" onClick={convertToProject}><Rocket size={14} /> Create project</Button>}
        </div>
      </div>
    </Modal>
  );
}

const REPORT_TYPES = [
  { key: "employee-performance", label: "Employee Performance Report", icon: Award, desc: "Performance scores, productivity and manager ratings for every employee." },
  { key: "attendance", label: "Attendance Report", icon: Clock, desc: "Monthly attendance percentage and status breakdown per employee." },
  { key: "leave", label: "Leave Report", icon: CalendarDays, desc: "Every leave request with type, duration and approval status." },
  { key: "project", label: "Project Report", icon: Briefcase, desc: "Status, progress, budget and spend across every project." },
  { key: "client", label: "Client Report", icon: Building2, desc: "Client accounts, lifecycle stage and account ownership." },
  { key: "sales", label: "Sales Report", icon: Target, desc: "Open leads, stage, value and forecast probability." },
  { key: "quotation", label: "Quotation Report", icon: FileText, desc: "All quotations issued with value and status." },
  { key: "invoice", label: "Invoice Report", icon: Receipt, desc: "Invoice register with amounts, balances and due dates." },
  { key: "revenue", label: "Revenue Report", icon: Wallet, desc: "Monthly revenue trend for the year." },
  { key: "expense", label: "Expense Report", icon: TrendingDown, desc: "Monthly expenses across the year." },
  { key: "profit", label: "Profit Report", icon: TrendingUp, desc: "Monthly profit and margin trend." },
  { key: "payroll", label: "Payroll Report", icon: Banknote, desc: "Payroll breakdown and net pay for every employee." },
  { key: "productivity", label: "Productivity Report", icon: Gauge, desc: "Productivity ranking across the whole team." },
];

function buildReportRows(key, app) {
  const { employees, tasks, projects, clients, leads, quotations, invoices, leaves } = app;
  switch (key) {
    case "employee-performance": return employees.map((e) => { const p = computeMonthlyPerformance(e, tasks); return { Employee: e.name, Department: e.department, Performance: e.performanceScore, Productivity: e.productivity, Quality: p.qualityScore, ManagerRating: p.managerRating }; });
    case "attendance": return employees.map((e) => { const a = attendanceStats(e.id); return { Employee: e.name, Present: a.present, Absent: a.absent, WFH: a.wfh, HalfDay: a.half, AttendancePct: a.pct }; });
    case "leave": return leaves.map((l) => ({ Employee: getEmployee(l.employeeId)?.name, Type: l.type, From: l.from, To: l.to, Days: l.days, Status: l.status }));
    case "project": return projects.map((p) => ({ Project: p.name, Client: getClient(p.clientId)?.company, Status: p.status, Progress: p.progress, Budget: p.budget, Spent: p.spent }));
    case "client": return clients.map((c) => ({ Client: c.company, Industry: c.industry, Stage: c.stage, Owner: getEmployee(c.assignedSales)?.name }));
    case "sales": return leads.map((l) => ({ Company: l.company, Stage: l.stage, Value: l.value, Probability: l.probability, NextFollowUp: l.nextFollowUp }));
    case "quotation": return quotations.map((q) => ({ Quotation: q.id, Title: q.title, Total: calcQuotationTotals(q).total, Status: q.status }));
    case "invoice": return invoices.map((i) => ({ Invoice: i.id, Client: getClient(i.clientId)?.company, Total: calcInvoiceTotals(i).total, Balance: calcInvoiceTotals(i).balance, Status: i.status }));
    case "revenue": return REVENUE_MONTHLY.map((m) => ({ Month: m.month, Revenue: m.revenue }));
    case "expense": return REVENUE_MONTHLY.map((m) => ({ Month: m.month, Expenses: m.expenses }));
    case "profit": return REVENUE_MONTHLY.map((m) => ({ Month: m.month, Profit: m.profit, MarginPct: Math.round((m.profit / m.revenue) * 100) }));
    case "payroll": return employees.map((e) => { const p = computePayroll(e, PAYROLL_SEED.find((s) => s.employeeId === e.id)); return { Employee: e.name, Basic: p.basic, Gross: p.gross, Net: p.net }; });
    case "productivity": return [...employees].sort((a, b) => b.productivity - a.productivity).map((e, i) => ({ Rank: i + 1, Employee: e.name, Productivity: e.productivity }));
    default: return [];
  }
}

function buildAIContext(app) {
  const { employees, tasks, projects, invoices, leads } = app;
  const overdueTasks = tasks.filter((t) => t.status !== "COMPLETED" && new Date(t.deadline) < DEMO_TODAY);
  const atRiskProjects = projects.filter((p) => p.status !== "Completed" && p.status !== "Cancelled" && new Date(p.deadline) < addDays(DEMO_TODAY, 21) && p.progress < 90);
  return {
    today: isoDate(DEMO_TODAY),
    employees: employees.map((e) => ({ name: e.name, department: e.department, role: e.designation, performanceScore: e.performanceScore, productivity: e.productivity, attendancePct: e.attendancePct })),
    projects: projects.map((p) => ({ name: p.name, client: getClient(p.clientId)?.company, status: p.status, progress: p.progress, budget: p.budget, spent: p.spent, deadline: p.deadline })),
    overdueTasksCount: overdueTasks.length,
    overdueTasks: overdueTasks.slice(0, 12).map((t) => ({ title: t.title, assignee: getEmployee(t.assigneeId)?.name, deadline: t.deadline, status: t.status, project: t.projectId ? getProject(t.projectId)?.name : null })),
    atRiskProjects: atRiskProjects.map((p) => p.name),
    invoices: invoices.map((i) => ({ client: getClient(i.clientId)?.company, status: i.status, total: calcInvoiceTotals(i).total, balance: calcInvoiceTotals(i).balance, dueDate: i.dueDate })),
    revenueMonthly: REVENUE_MONTHLY,
    leads: leads.map((l) => ({ company: l.company, stage: l.stage, value: l.value, probability: l.probability })),
  };
}

function AIAssistantView() {
  const { theme } = useApp();
  const app = useApp();
  const [messages, setMessages] = useState([{ role: "assistant", text: "Hi, I'm the TAQVION AI Assistant. Ask me about employee productivity, project health, finances or sales — I'll answer using your live ERP data." }]);
  const [input, setInput] = useState("");
  const [loading, setLoading] = useState(false);
  const scrollRef = useRef(null);

  useEffect(() => { if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight; }, [messages, loading]);

  async function send(question) {
    const q = (question || input).trim();
    if (!q || loading) return;
    setMessages((m) => [...m, { role: "user", text: q }]);
    setInput("");
    setLoading(true);
    try {
      const context = buildAIContext(app);
      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 1000,
          system: "You are the TAQVION ERP AI Assistant, embedded inside an AI/software agency's internal management platform. Answer questions about the agency's operations using ONLY the JSON data provided — never invent names, numbers or facts that aren't in it. Be specific and concise (2-5 sentences), cite real names and figures from the data, and format money with the ₹ symbol. If the data doesn't contain what's needed to answer, say so plainly instead of guessing.",
          messages: [{ role: "user", content: `ERP DATA:\n${JSON.stringify(context)}\n\nQUESTION: ${q}` }],
        }),
      });
      const data = await res.json();
      const text = (data.content || []).map((b) => b.text || "").join("\n").trim() || "I couldn't generate a response just now — please try again.";
      setMessages((m) => [...m, { role: "assistant", text }]);
    } catch (err) {
      setMessages((m) => [...m, { role: "assistant", text: "The AI service isn't reachable right now. This feature calls Claude live and needs the artifact running inside Claude.ai with network access." }]);
    } finally {
      setLoading(false);
    }
  }

  const summary = useMemo(() => computeMonthlySummary(app), [app.tasks, app.projects, app.invoices, app.employees]);
  const insightIcon = { warning: AlertTriangle, positive: TrendingUp, info: Info };
  const insightColor = { warning: CHART_COLORS.amber, positive: CHART_COLORS.emerald, info: CHART_COLORS.blue };

  return (
    <div className="taq-anim-in">
      <PageHeader title="AI Assistant" subtitle="Ask questions about your agency — powered live by Claude" />
      <div className="grid grid-cols-1 lg:grid-cols-3 gap-5">
        <Card className="p-0 lg:col-span-2 flex flex-col overflow-hidden" style={{ height: 560 }}>
          <div ref={scrollRef} className="flex-1 overflow-y-auto taq-scroll p-5 space-y-3">
            {messages.map((m, i) => (
              <div key={i} className={`flex ${m.role === "user" ? "justify-end" : "justify-start"}`}>
                <div
                  className={`rounded-2xl px-4 py-2.5 text-sm leading-relaxed ${m.role === "user" ? "" : tw(theme, "bg-slate-800 text-slate-200", "bg-slate-100 text-slate-700")}`}
                  style={{ maxWidth: "85%", ...(m.role === "user" ? { background: BRAND.cyan, color: BRAND.navy } : {}) }}
                >
                  {m.text}
                </div>
              </div>
            ))}
            {loading && (
              <div className="flex justify-start">
                <div className={`rounded-2xl px-4 py-2.5 text-sm flex items-center gap-2 ${tw(theme, "bg-slate-800 text-slate-400", "bg-slate-100 text-slate-500")}`}><Loader2 size={14} className="animate-spin" /> Thinking…</div>
              </div>
            )}
          </div>
          <div className={`p-4 border-t ${tw(theme, "border-slate-800", "border-slate-200")}`}>
            <div className="flex flex-wrap gap-1.5 mb-3">
              {AI_QUICK_QUESTIONS.map((q) => (
                <button key={q} onClick={() => send(q)} className={`text-xs px-2.5 py-1.5 rounded-full transition-colors ${tw(theme, "bg-slate-800 text-slate-300 hover:bg-slate-700", "bg-slate-100 text-slate-600 hover:bg-slate-200")}`}>{q}</button>
              ))}
            </div>
            <div className="flex gap-2">
              <input value={input} onChange={(e) => setInput(e.target.value)} onKeyDown={(e) => e.key === "Enter" && send()} placeholder="Ask about employees, projects, finances…" className={`flex-1 px-3.5 py-2.5 rounded-xl text-sm outline-none border ${tw(theme, "bg-slate-800 border-slate-700 text-white placeholder-slate-500", "bg-slate-50 border-slate-200 text-slate-900 placeholder-slate-400")}`} />
              <Button onClick={() => send()} disabled={loading}><Send size={15} /></Button>
            </div>
          </div>
        </Card>
        <Card className="p-5">
          <SectionHeader title="Monthly summary" subtitle="Computed live from your data" />
          <div className="space-y-3">

const EVENT_TYPE_COLOR = { task: CHART_COLORS.blue, project: CHART_COLORS.violet, leave: CHART_COLORS.amber, holiday: CHART_COLORS.emerald, followup: CHART_COLORS.cyan };

function buildCalendarEvents(app) {
  const { tasks, projects, leaves, announcements, leads } = app;
  const events = {};
  function push(date, label, type) { if (!events[date]) events[date] = []; events[date].push({ label, type }); }
  tasks.forEach((t) => push(t.deadline, t.title, "task"));
  projects.forEach((p) => push(p.deadline, p.name.split(" — ")[0] + " due", "project"));
  leaves.filter((l) => l.status === "Approved").forEach((l) => {
    for (let d = new Date(l.from); d <= new Date(l.to); d = addDays(d, 1)) push(isoDate(d), `${getEmployee(l.employeeId)?.name} on leave`, "leave");
  });
  announcements.filter((a) => a.type === "Holiday").forEach((a) => push(a.date, a.title, "holiday"));
  leads.forEach((l) => push(l.nextFollowUp, `Follow up: ${l.company}`, "followup"));
  return events;
}

function CalendarView() {
  const { theme } = useApp();
  const app = useApp();
  const [monthOffset, setMonthOffset] = useState(0);
  const [selectedDate, setSelectedDate] = useState(isoDate(DEMO_TODAY));
  const events = useMemo(() => buildCalendarEvents(app), [app.tasks, app.projects, app.leaves, app.announcements, app.leads]);

  const base = new Date(2026, 8 + monthOffset, 1);
  const year = base.getFullYear(), month = base.getMonth();
  const startWeekday = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < startWeekday; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);
  const monthLabel = base.toLocaleDateString("en-IN", { month: "long", year: "numeric" });
  const selectedEvents = selectedDate ? events[selectedDate] || [] : [];

  return (
    <div className="taq-anim-in">
      <PageHeader
        title="Calendar"
        subtitle="Meetings, deadlines, leaves and holidays in one place"
        action={
          <div className="flex items-center gap-1">
            <IconBtn icon={ChevronLeft} onClick={() => setMonthOffset((m) => m - 1)} />
            <span className={`text-sm font-medium text-center ${tw(theme, "text-white", "text-slate-900")}`} style={{ width: 130 }}>{monthLabel}</span>
            <IconBtn icon={ChevronRight} onClick={() => setMonthOffset((m) => m + 1)} />
          </div>
        }
      />
      <div className="grid grid-cols-1 lg:grid-cols-3 gap-5">
        <Card className="p-5 lg:col-span-2">
          <div className="grid grid-cols-7 gap-1 mb-2">
            {["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"].map((d) => (<div key={d} className={`text-xs font-medium text-center py-1 ${tw(theme, "text-slate-500", "text-slate-400")}`}>{d}</div>))}
          </div>
          <div className="grid grid-cols-7 gap-1">
            {cells.map((d, i) => {
              if (d === null) return <div key={i} />;
              const dateStr = `${year}-${pad2(month + 1)}-${pad2(d)}`;
              const dayEvents = events[dateStr] || [];
              const isToday = dateStr === isoDate(DEMO_TODAY);
              return (
                <button key={i} onClick={() => setSelectedDate(dateStr)} className="rounded-lg p-1.5 text-left transition-colors" style={{ background: selectedDate === dateStr ? `${BRAND.cyan}1E` : "transparent", border: isToday ? `1px solid ${BRAND.cyan}` : "1px solid transparent", minHeight: 62 }}>
                  <div className={`text-xs mb-1 ${isToday ? "font-bold" : tw(theme, "text-slate-400", "text-slate-500")}`} style={isToday ? { color: BRAND.cyan } : undefined}>{d}</div>
                  <div className="flex flex-wrap gap-0.5">
                    {dayEvents.slice(0, 3).map((e, j) => (<span key={j} className="w-1.5 h-1.5 rounded-full" style={{ background: EVENT_TYPE_COLOR[e.type] }} />))}
                  </div>
                </button>
              );
            })}
          </div>
        </Card>
        <Card className="p-5">
          <SectionHeader title={selectedDate ? fmtDate(selectedDate) : "Select a date"} />
          {selectedEvents.length === 0 ? (
            <EmptyState icon={CalendarDays} title="No events" body="Pick a highlighted day to see what's on." />
          ) : (
            <div className="space-y-2.5">
              {selectedEvents.map((e, i) => (
                <div key={i} className="flex items-start gap-2.5">
                  <span className="w-2 h-2 rounded-full mt-1.5 flex-shrink-0" style={{ background: EVENT_TYPE_COLOR[e.type] }} />
                  <span className={`text-sm ${tw(theme, "text-slate-300", "text-slate-600")}`}>{e.label}</span>
                </div>
              ))}
            </div>
          )}
        </Card>
      </div>
    </div>
  );
}

          <div><label className={labelCls}>Email</label><input className={inputCls} value={form.email} onChange={(e) => setForm({ ...form, email: e.target.value })} /></div>
          <div><label className={labelCls}>Address</label><input className={inputCls} value={form.address} onChange={(e) => setForm({ ...form, address: e.target.value })} /></div>
          <div><label className={labelCls}>GSTIN</label><input className={inputCls} value={form.gstin} onChange={(e) => setForm({ ...form, gstin: e.target.value })} /></div>

}

function SettingsDepartments() {

      <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
        {DEPARTMENTS.map((d) => {
          const count = employees.filter((e) => e.department === d).length;

function SettingsPermissions() {
  const { theme, permissions, setPermissions } = useApp();
  function toggle(role, key) {
    setPermissions((prev) => {
      const current = prev[role] || [];
      const has = current.includes(key);
      return { ...prev, [role]: has ? current.filter((k) => k !== key) : [...current, key] };
    });
  }
  return (
    <Card className="p-5">
      <SectionHeader title="Roles & permissions" subtitle="Control which modules each role can see — changes apply immediately" />
      <div className="overflow-x-auto taq-scroll">
        <table className="text-sm" style={{ minWidth: 720 }}>
          <thead>
            <tr>
              <th className={`text-left pb-2 pr-3 text-xs font-medium sticky left-0 ${tw(theme, "text-slate-500 bg-slate-900", "text-slate-400 bg-white")}`}>Module</th>
              {ROLES.map((r) => (<th key={r} className={`text-center pb-2 px-2 text-xs font-medium ${tw(theme, "text-slate-500", "text-slate-400")}`} style={{ minWidth: 78 }}>{r.replace("/HR", "")}</th>))}
            </tr>
          </thead>
          <tbody>
            {NAV_ITEMS.map((item) => (
              <tr key={item.key} className={`border-t ${tw(theme, "border-slate-800", "border-slate-100")}`}>
                <td className={`py-2 pr-3 sticky left-0 ${tw(theme, "text-slate-200 bg-slate-900", "text-slate-700 bg-white")}`}><div className="flex items-center gap-2"><item.icon size={14} className={tw(theme, "text-slate-500", "text-slate-400")} />{item.label}</div></td>
                {ROLES.map((r) => {
                  const checked = (permissions[r] || []).includes(item.key);
                  const disabled = r === "Super Admin";
                  return (
                    <td key={r} className="text-center py-2 px-2">
                      <button disabled={disabled} onClick={() => toggle(r, item.key)} className="w-5 h-5 rounded-md inline-flex items-center justify-center transition-colors disabled:opacity-60" style={{ background: checked ? BRAND.cyan : tw(theme, "#1E293B", "#F1F5F9") }}>
                        {checked && <Check size={12} color={BRAND.navy} />}
                      </button>
                    </td>
                  );
                })}
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </Card>
  );
}

const DEFAULT_PAYROLL_STATUSES = Object.fromEntries(EMPLOYEES.map((e) => [e.id, e.id === "E09" ? "Draft" : "Processed"]));

function App() {
  const [booted, setBooted] = useState(false);
  const [session, setSession] = useState(null);
  const [theme, setTheme] = useState("dark");
  const [view, setView] = useState("dashboard");
  const [sidebarOpen, setSidebarOpen] = useState(false);

  const [employees, setEmployees] = useState(EMPLOYEES);
  const [tasks, setTasks] = useState(TASKS_SEED);
  const [projects, setProjects] = useState(PROJECTS);
  const [clients, setClients] = useState(CLIENTS);
  const [leads, setLeads] = useState(LEADS_SEED);
  const [quotations, setQuotations] = useState(QUOTATIONS_SEED);
  const [invoices, setInvoices] = useState(INVOICES_SEED);
  const [leaves, setLeaves] = useState(LEAVES_SEED);
  const [announcements, setAnnouncements] = useState(ANNOUNCEMENTS_SEED);
  const [documents, setDocuments] = useState(DOCUMENTS_SEED);
  const [businessAnalyses, setBusinessAnalyses] = useState(BUSINESS_ANALYSES_SEED);
  const [permissions, setPermissions] = useState(DEFAULT_PERMISSIONS);
  const [payrollStatuses, setPayrollStatuses] = useState(DEFAULT_PAYROLL_STATUSES);
  const [auditLog, setAuditLog] = useState([]);

  useEffect(() => {
    let cancelled = false;
    (async () => {
      try {
        const s = await window.storage.get("taqvion:session", false);
        if (!cancelled && s && s.value) {
          const parsed = JSON.parse(s.value);
          if (parsed.session) setSession(parsed.session);
          if (parsed.theme) setTheme(parsed.theme);
        }
      } catch (e) { /* no saved session yet — that's fine */ }
      if (!cancelled) setBooted(true);
    })();
    return () => { cancelled = true; };
  }, []);

  function persist(nextSession, nextTheme) {
    try { window.storage.set("taqvion:session", JSON.stringify({ session: nextSession, theme: nextTheme }), false); } catch (e) { /* storage unavailable — session just won't survive reload */ }
  }
  function login(role, employeeId) {
    const s = { role, employeeId };
    setSession(s);
    setView("dashboard");
    persist(s, theme);
  }
  function logout() {
    setSession(null);
    persist(null, theme);
  }
  function toggleTheme() {
    setTheme((t) => { const nt = t === "dark" ? "light" : "dark"; persist(session, nt); return nt; });
  }
  function logAudit(action) {
    setAuditLog((prev) => {
      const actorName = session ? (getEmployee(session.employeeId)?.name || session.role) : "System";
      return [{ id: "AL" + (prev.length + 1), actor: actorName, action, time: new Date().toISOString() }, ...prev].slice(0, 200);
    });
  }

  if (!booted) return <BootScreen />;
  if (!session) return <Login onLogin={login} />;

  const ctx = {
    session, theme, toggleTheme, view, setView, sidebarOpen, setSidebarOpen, logout,
    employees, setEmployees, tasks, setTasks, projects, setProjects, clients, setClients,
    leads, setLeads, quotations, setQuotations, invoices, setInvoices, leaves, setLeaves,
    announcements, setAnnouncements, documents, setDocuments, businessAnalyses, setBusinessAnalyses,
    permissions, setPermissions, payrollStatuses, setPayrollStatuses, auditLog, logAudit,
  };

  const VIEWS = {
    dashboard: DashboardView, employees: EmployeesView, attendance: AttendanceView, leave: LeaveView,
    tasks: TasksView, projects: ProjectsView, clients: ClientsView, leads: LeadsView,
    businessAnalysis: BusinessAnalysisView, quotations: QuotationsView, invoices: InvoicesView,
    finance: FinanceView, payroll: PayrollView, calendar: CalendarView, documents: DocumentsView,
    reports: ReportsView, aiAssistant: AIAssistantView, announcements: AnnouncementsView, settings: SettingsView,
  };
  const ActiveView = VIEWS[view] || DashboardView;

  return (
    <AppCtx.Provider value={ctx}>
      <style>{GLOBAL_CSS}</style>
      <div className={`min-h-screen flex ${tw(theme, "bg-slate-950 text-slate-100", "bg-slate-50 text-slate-900")}`}>
        <Sidebar />
        <div className="flex-1 min-w-0 flex flex-col">
          <Topbar />
          <main className="flex-1 p-4 sm:p-6 lg:p-7 overflow-x-hidden">
            <ActiveView />
          </main>
        </div>
      </div>
    </AppCtx.Provider>
  );
}

const rootEl = document.getElementById("root");
ReactDOM.createRoot(rootEl).render(<App />);

</script>

<script>
(function () {
  function showFatalError(title, msg) {
    var root = document.getElementById("root");
    if (!root) return;
    root.innerHTML =
      '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0F172A;font-family:-apple-system,BlinkMacSystemFont,\'Segoe UI\',Roboto,sans-serif;padding:24px;">' +
      '<div style="max-width:440px;text-align:center;">' +
      '<div style="color:#fff;font-weight:700;font-size:18px;margin-bottom:10px;">' + title + '</div>' +
      '<div style="color:#94A3B8;font-size:14px;line-height:1.6;">' + msg + '</div>' +
      '</div></div>';
  }

  if (typeof React === "undefined" || typeof ReactDOM === "undefined") {
    showFatalError(
      "TAQVION couldn\u2019t start",
      "A required library (React) failed to load from the CDN. Check your internet connection and reload the page."
    );
    return;
  }
  if (typeof Babel === "undefined") {
    showFatalError(
      "TAQVION couldn\u2019t start",
      "A required library (Babel) failed to load from the CDN. Check your internet connection and reload the page."
    );
    return;
  }

  try {
    var source = document.getElementById("app-source").textContent;
    var output = Babel.transform(source, {
      presets: [["react", { runtime: "classic" }]],
    }).code;
    var script = document.createElement("script");
    script.textContent = output;
    document.body.appendChild(script);
  } catch (err) {
    showFatalError("TAQVION hit a startup error", (err && err.message) ? err.message : String(err));
    if (window.console && console.error) console.error(err);
  }
})();
</script>
